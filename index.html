<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e0673a">
  <title>요리 일기</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 상단 바 -->
  <header class="topbar">
    <button id="backBtn" class="icon-btn hidden" aria-label="뒤로">←</button>
    <h1 id="pageTitle">요리 일기</h1>
    <button id="pickBtn" class="icon-btn" aria-label="오늘 뭐 먹지" title="오늘 뭐 먹지?">🎲</button>
    <button id="menuBtn" class="icon-btn" aria-label="백업">⋯</button>
  </header>

  <main id="app"></main>

  <!-- 새 레시피 추가 버튼 -->
  <button id="addBtn" class="fab" aria-label="레시피 추가">＋</button>

  <!-- 입력 창(팝업) -->
  <dialog id="dialog"></dialog>

  <!-- 백업 파일 불러오기용 (화면에는 안 보임) -->
  <input type="file" id="importFile" accept="application/json" hidden>

  <script src="app.js"></script>
</body>
</html>
